<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Justice for Nolan Wells</title>
<style>
:root{--bg:#0a0d11;--card:#1a1f26;--text:#e8e6d9;--muted:#9aa0a6;--orange:#ff6b2b;--line:#2a323c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{position:sticky;top:0;background:#0a0d11;border-bottom:1px solid var(--line);padding:14px 18px;z-index:10}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
nav button{background:#1a1f26;border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:9px;font-size:.68rem;font-weight:800;letter-spacing:.11em;cursor:pointer}
nav button.active{background:var(--orange);color:#000;border-color:var(--orange)}
.wrap{max-width:1100px;margin:auto;padding:20px}
.section{display:none}.section.active{display:block}
.kicker{color:var(--orange);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(1.9rem,4vw,3rem);line-height:.95;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.item{padding:12px;background:#12161c;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;font-size:.9rem;line-height:1.5}
.item b{color:var(--orange)}
iframe{width:100%;height:220px;border-radius:10px;border:1px solid var(--line)}
</style>
</head>
<body>
<header>
<div style="font-weight:900">justicefornolanwells.com</div>
<div style="color:#9aa0a6;font-size:.72rem">Nolan Wells — Horn Island · July 4, 2026 — Reads from forensic/ files</div>
<nav>
<button class="active" data-tab="timeline">TIMELINE</button>
<button data-tab="contradictions">CONTRADICTIONS</button>
<button data-tab="discrepancies">DISCREPANCIES</button>
<button data-tab="evidence">EVIDENCE</button>
</nav>
</header>
<div class="wrap">
<div id="timeline" class="section active"><h1>What happened to Nolan Wells?</h1><div id="timeline-list" class="card">Loading from forensic/evidence.json...</div></div>
<div id="contradictions" class="section"><h1>Contradictions</h1><div id="contradictions-list" class="card">Loading...</div></div>
<div id="discrepancies" class="section"><h1>Discrepancies</h1><div id="discrepancies-list" class="card">Loading...</div></div>
<div id="evidence" class="section"><h1>Evidence Library</h1><div id="video-count" class="kicker"></div><div id="video-grid"></div></div>
</div>
<script>
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');
}));
async function load(){
 try{
  const res = await fetch('forensic/evidence.json?'+Date.now());
  const data = await res.json();
  const ver = data.verified || {};
  
  // Timeline
  document.getElementById('timeline-list').innerHTML = (ver.timeline||[]).map(t=>`<div class="item"><b>${t.time}</b> — ${t.event}<br><small style="color:#9aa0a6">${t.source} — ${t.verified?'VERIFIED YES':'UNDER REVIEW'}</small></div>`).join('');
  
  // Contradictions
  document.getElementById('contradictions-list').innerHTML = (ver.contradictions||[]).map(c=>`<div class="item"><b>${c.id}. ${c.title}</b><br>${c.detail}<br><small style="color:#9aa0a6">Sources: ${(c.sources||[]).join(', ')}</small></div>`).join('');
  
  // Discrepancies
  document.getElementById('discrepancies-list').innerHTML = (ver.discrepancies||[]).map(d=>`<div class="item">${d}</div>`).join('');
  
  // Videos
  const vids = data.videos||[];
  document.getElementById('video-count').textContent = vids.length + ' videos — data lives in forensic/evidence.json (not hard-coded in index)';
  document.getElementById('video-grid').innerHTML = vids.map(v=>{
    if(v.id && v.id.length===11){
      return `<div class="card"><h3 style="color:#ff6b2b;font-size:.8rem">${v.title}</h3><p style="color:#9aa0a6;font-size:.7rem">${v.channel} · ${v.query_match}</p><iframe src="https://www.youtube.com/embed/${v.id}" allowfullscreen></iframe><p style="margin-top:8px"><a href="${v.url}" target="_blank" style="color:#ff6b2b">Watch on YouTube</a></p></div>`;
    } else {
      return `<div class="card"><h3 style="color:#ff6b2b;font-size:.8rem">${v.title}</h3><p style="color:#9aa0a6;font-size:.7rem">${v.channel}</p><div class="item"><a href="${v.url}" target="_blank" style="color:#ff6b2b">Open video list — ${v.channel}</a><br><small>${v.note||''}</small></div></div>`;
    }
  }).join('');
 }catch(e){
  document.getElementById('timeline-list').textContent='Failed to load forensic/evidence.json — check file exists';
 }
}
load();
</script>
</body>
</html>
