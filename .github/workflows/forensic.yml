name: Forensic Auto-Pull 25 Layers
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */3 * * *' # every 3 hours
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python pull_all.py
      - run: |
          git config user.name "forensic-bot"
          git config user.email "bot@justicefornolanwells.com"
          git add forensic/
          git diff --staged --quiet || git commit -m "Auto-pull 25 layers $(date -u)"
          git push
