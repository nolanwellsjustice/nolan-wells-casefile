name: forensic-hunter
on:
  workflow_dispatch:
  schedule:
        - cron: "0 */6 * * *"
  push:
    paths:
            - "pull_all.py"
            - "sources.yaml"

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
            - run: pip install -r requirements.txt
            - run: python pull_all.py
            - run: |
          git config user.name "forensic-bot"
          git config user.email "bot@justicefornolanwells.com"
          git add forensic/
          git commit -m "auto-hunt: videos + transcripts" || echo "no changes"
          git push
