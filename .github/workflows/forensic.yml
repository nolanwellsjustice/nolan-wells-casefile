name: forensic-hunter
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "pull_all.py"
      - "sources.yaml"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install yt-dlp requests pyyaml
      - name: Hunt
        run: python pull_all.py
      - name: Commit
        run: |
          git config user.name "forensic-bot"
          git config user.email "bot@justicefornolanwells.com"
          git add forensic/ || true
          git commit -m "auto-hunt: videos found" || echo "no changes"
          git push || echo "push done"
